name: Publish NuGet packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 4.0.0-alpha)'
        required: true
      dry_run:
        description: 'Dry run — build but do not push to NuGet.org'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          }
          $av = ($v -split '-')[0]
          Write-Output "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "ASM_VERSION=$av" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing version: $v (assembly: $av)"

      # Produces the `tik4net` package containing BOTH tik4net.dll and tik4net.objects.dll.
      # Since 4.0 the O/R mapper is no longer published separately (was tik4net.objects,
      # then tik4net.entities) — see the comment in tik4net.package.csproj for the rationale.
      - name: Pack tik4net (core + O/R mapper)
        run: >
          dotnet pack tik4net.package/tik4net.package.csproj
          -c Release
          -o Build
          /p:Version=${{ steps.ver.outputs.VERSION }}
          /p:AssemblyVersion=${{ steps.ver.outputs.ASM_VERSION }}.0
          /p:FileVersion=${{ steps.ver.outputs.ASM_VERSION }}.0

      - name: Pack tik4net.testing
        run: >
          dotnet pack tik4net.testing/tik4net.testing.csproj
          -c Release
          -o Build
          /p:Version=${{ steps.ver.outputs.VERSION }}
          /p:AssemblyVersion=${{ steps.ver.outputs.ASM_VERSION }}.0
          /p:FileVersion=${{ steps.ver.outputs.ASM_VERSION }}.0

      - name: Pack tik4net.ssh
        run: >
          dotnet pack tik4net.ssh/tik4net.ssh.csproj
          -c Release
          -o Build
          /p:Version=${{ steps.ver.outputs.VERSION }}
          /p:AssemblyVersion=${{ steps.ver.outputs.ASM_VERSION }}.0
          /p:FileVersion=${{ steps.ver.outputs.ASM_VERSION }}.0

      - name: Pack tik4net.mcp (.NET tool)
        run: >
          dotnet pack Tools/tik4net.mcp/tik4net.mcp.csproj
          -c Release
          -o Build
          /p:Version=${{ steps.ver.outputs.VERSION }}
          /p:AssemblyVersion=${{ steps.ver.outputs.ASM_VERSION }}.0
          /p:FileVersion=${{ steps.ver.outputs.ASM_VERSION }}.0

      - name: List build artifacts
        shell: pwsh
        run: Get-ChildItem Build\*.nupkg | Select-Object Name, Length

      - name: Push to NuGet.org
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "Build\*.nupkg"
          --api-key $env:NUGET_API_KEY
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: >
          dotnet nuget push "Build\*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/danikf/index.json
          --skip-duplicate

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.VERSION }}
          prerelease: ${{ contains(steps.ver.outputs.VERSION, '-') }}
          generate_release_notes: true
          body: |
            ## tik4net ${{ steps.ver.outputs.VERSION }}

            Full release notes and version history: **[Wiki → History](https://github.com/danikf/tik4net/wiki/History)**

            ### What's new in 5.0

            - **RoMON** — reach a router you have no IP route to, through a neighbouring MikroTik, over Telnet, SSH, MAC-Telnet or any WinBox transport; RoMON discover and ping included
            - **One codebase from RouterOS 6.49 to 7.24** — the same entities read and write correctly on each version, tested on 7.24.5, 7.21.5 and 6.49.13
            - **`TikField<T>`** — a property knows whether the router printed the field; it never invents a default, and a value from a newer RouterOS does not break the read
            - **`DescribeMenu`** — ask the router what a menu takes: sub-menus, commands, arguments, readable and clearable fields, accepted words, from the router's own grammar
            - **Connection string** — `TikConnectionSetup.FromConnectionString`: router, credentials and transport come from config
            - **Negated matchers and value lists** — `src-address=!10.0.0.0/8` is a negated address; `dst-port=22,8291`, `tcp-flags=syn,!ack` are typed, immutable `TikValueList<T>`
            - **Analyzers TIK001 / TIK002 / TIK003** — compile-time warnings for `TikField` comparisons that can never be true and for a list item containing `,`, each with a code fix
            - **SSH private-key login**, **list sync with the fewest moves**, and **filtered CLI reads that run on the router**

            ### Breaking changes (from 4.x)

            Full guide, with before/after code: **[Upgrading from 4.x to 5.0](https://github.com/danikf/tik4net/wiki/Upgrading-from-4.x-to-5.0)** — and a ready-to-paste prompt for an AI coding agent: **[with an AI agent](https://github.com/danikf/tik4net/wiki/Upgrading-from-4.x-to-5.0-with-an-AI-agent)**

            Package IDs, namespaces and the connection API are unchanged. What changed:

            - **Every entity property except `.id` is a `TikField<T?>`** — the compiler finds most of it; read *What compiles but changed meaning* in the guide, above all if you merge or diff entity lists
            - **Adds and singleton saves send only what you assigned** — a property's `DefaultValue` documents the router's default without acting on it
            - **Multi-value fields are `TikValueList<T>`**; timeouts and command durations are `TimeSpan`; dates are `DateTime`
            - **A filter on a field the menu does not have throws**, and a CLI read the router refuses with a parse error throws `TikCommandTrapException`
            - A refused or unreachable port throws `SocketException`; `Guard` and `LinqEx` are internal; a few entities changed shape (see the guide)

            ### NuGet packages
            | Package | Install |
            |---|---|
            | `tik4net` *(core + O/R mapper)* | `dotnet add package tik4net --version ${{ steps.ver.outputs.VERSION }}` |
            | `tik4net.ssh` *(satellite, opt-in)* | `dotnet add package tik4net.ssh --version ${{ steps.ver.outputs.VERSION }}` |
            | `tik4net.testing` | `dotnet add package tik4net.testing --version ${{ steps.ver.outputs.VERSION }}` |
            | `tik4net.mcp` *(dev/debug helper tool)* | `dotnet tool install -g tik4net.mcp --version ${{ steps.ver.outputs.VERSION }}` |

            ---
          files: |
            Build/*.nupkg
