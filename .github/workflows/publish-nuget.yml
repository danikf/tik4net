name: Publish NuGet packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 4.0.0-alpha)'
        required: true
      dry_run:
        description: 'Dry run — build but do not push to NuGet.org'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          }
          $av = ($v -split '-')[0]
          Write-Output "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "ASM_VERSION=$av" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing version: $v (assembly: $av)"

      # Produces the `tik4net` package containing BOTH tik4net.dll and tik4net.objects.dll.
      # Since 4.0 the O/R mapper is no longer published separately (was tik4net.objects,
      # then tik4net.entities) — see the comment in tik4net.package.csproj for the rationale.
      - name: Pack tik4net (core + O/R mapper)
        run: >
          dotnet pack tik4net.package/tik4net.package.csproj
          -c Release
          -o Build
          /p:Version=${{ steps.ver.outputs.VERSION }}
          /p:AssemblyVersion=${{ steps.ver.outputs.ASM_VERSION }}.0
          /p:FileVersion=${{ steps.ver.outputs.ASM_VERSION }}.0

      - name: Pack tik4net.testing
        run: >
          dotnet pack tik4net.testing/tik4net.testing.csproj
          -c Release
          -o Build
          /p:Version=${{ steps.ver.outputs.VERSION }}
          /p:AssemblyVersion=${{ steps.ver.outputs.ASM_VERSION }}.0
          /p:FileVersion=${{ steps.ver.outputs.ASM_VERSION }}.0

      - name: Pack tik4net.ssh
        run: >
          dotnet pack tik4net.ssh/tik4net.ssh.csproj
          -c Release
          -o Build
          /p:Version=${{ steps.ver.outputs.VERSION }}
          /p:AssemblyVersion=${{ steps.ver.outputs.ASM_VERSION }}.0
          /p:FileVersion=${{ steps.ver.outputs.ASM_VERSION }}.0

      - name: Pack tik4net.mcp (.NET tool)
        run: >
          dotnet pack Tools/tik4net.mcp/tik4net.mcp.csproj
          -c Release
          -o Build
          /p:Version=${{ steps.ver.outputs.VERSION }}
          /p:AssemblyVersion=${{ steps.ver.outputs.ASM_VERSION }}.0
          /p:FileVersion=${{ steps.ver.outputs.ASM_VERSION }}.0

      - name: List build artifacts
        shell: pwsh
        run: Get-ChildItem Build\*.nupkg | Select-Object Name, Length

      - name: Push to NuGet.org
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "Build\*.nupkg"
          --api-key $env:NUGET_API_KEY
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: >
          dotnet nuget push "Build\*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/danikf/index.json
          --skip-duplicate

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.VERSION }}
          prerelease: ${{ contains(steps.ver.outputs.VERSION, '-') }}
          generate_release_notes: true
          body: |
            ## tik4net ${{ steps.ver.outputs.VERSION }}

            Full release notes and version history: **[Wiki → History](https://github.com/danikf/tik4net/wiki/History)**

            ### What's new in 4.0

            **9 new connection types** — all implement the same `ITikConnection` / `LoadAll<T>()` / `Save<T>()` interface:
            | Type | Transport | Port | Notes |
            |---|---|---|---|
            | `Rest` / `RestSsl` | HTTP/HTTPS | 80/443 | RouterOS 7.1+, CRUD only |
            | `Telnet` | TCP | 23 | plain-text terminal |
            | `MacTelnet` | UDP broadcast | 20561 | Layer-2, no IP needed |
            | `WinboxCli` | TCP | 8291 | WinBox terminal over TCP |
            | `WinboxCliMac` | UDP | 20561 | WinBox terminal over MAC |
            | `WinboxNative` | TCP | 8291 | native M2 binary protocol, full CRUD + streaming |
            | `WinboxNativeMac` | UDP | 20561 | native M2 over MAC |
            | `Ssh` *(satellite)* | TCP | 22 | requires `tik4net.ssh` NuGet |

            **Other additions:**
            - **Multi-targeting `netstandard2.0;net8.0`** — netstandard2.0 keeps the Unity / Xamarin / .NET Framework reach; the net8.0 leg carries the modern surface
            - **Async everywhere** — async CRUD on the O/R mapper, an async surface on every transport, and a cancel that actually cancels
            - **Streaming reads as `IAsyncEnumerable<ITikReSentence>`** (net8.0) — `await foreach` over a live monitor
            - **Change tracking** — the O/R mapper tracks which properties changed; `Save<T>()` sends only the diff
            - **Safe Mode** — `SafeModeTake()` / `SafeModeRelease()` / `SafeModeUnroll()` across all transports; auto-rollback on disconnect
            - **`TikConnectionSetup`** — the single entry point; every option is applied in one place, and a transport declares what it can honour by implementing `ITikTlsConnection` / `ITikMacLayerConnection` / `ITikCancellationModeConnection`
            - **Connection capability model** — `connection.Supports(TikConnectionCapability.Listen)` etc.
            - **Raw command pass-through** — `connection.CreateRawCommand(raw)` for commands outside the O/R mapper
            - **WinBox GUI-name addressing** — address entities by their WinBox display name on `WinboxNative`
            - **`tik4net.mcp`** — drive any command over any transport from an AI assistant

            ### Breaking changes (from 3.6)

            Full guide, with before/after code: **[Upgrading from 3.x to 4.0](https://github.com/danikf/tik4net/wiki/Upgrading-from-3.x-to-4.0)**

            These change what a working 3.x program does **without stopping the compiler** — read them first:

            - **An invalid TLS certificate is now rejected** — `AllowInvalidCertificate` defaults to `false` (was `true`). RouterOS normally presents a *self-signed* certificate, so an API-SSL / REST-SSL connection that opened in 3.x can now fail. Ask for it explicitly, or pin the certificate with `CertificateValidationCallback`
            - **Synchronous commands are tagged** — `SendTagWithSyncCommand` defaults to `true` (was `false`). This is what makes one connection usable from several threads. If you script a fake RouterOS in your tests, echo the tag back
            - **`ExecuteScalar` on a command that returns nothing** throws the new `TikCommandEmptyResponseException`, not `TikNoSuchItemException` — after a write, an empty answer means success
            - **`Save` diffs against the local snapshot** instead of a `LoadById` round-trip. `TikDefaults.SaveMode = TikSaveMode.FullUpdate` restores the 3.x behaviour

            And these stop the compiler:

            - **The O/R mapper is now inside the `tik4net` package** — it used to ship as `tik4net.objects` (3.x), then `tik4net.entities` (4.0.0-alpha). **Remove any `PackageReference` to those** or you get an assembly conflict. No source changes: namespaces and assembly names are unchanged
            - **`ITikConnection` is lifecycle and command factory only** — `CallCommandSync` moved to `ITikRawSentenceConnection`, Safe Mode to `ITikSafeModeConnection`, `SendTagWithSyncCommand` to `ITikTaggedConnection` (extension methods keep the call sites compiling). The `Thread`-returning `CallCommandAsync` is removed
            - **Nullable reference types are on** — every mapped reference-typed entity property is `string?`; every writable `bool` is `bool?`, as are numeric and enum properties carrying a router default, because `null` means "the router decides"
            - **Exception hierarchy unified** — `TikCommandException` subtypes restructured; review `catch` blocks on specific subtypes
            - **SSH is a satellite package** — add `tik4net.ssh` and call `Tik4NetSsh.Register()` at startup
            - **`TikConnectionType.Api_v2` / `ApiSsl_v2` are gone** — they were `[Obsolete(error)]` in 3.6
            - **Three `Interface` properties are read-only** (`Type`, `MacAddress`, `FastPath`) — `/interface set` does not accept them; `L2Mtu` was added, which it does

            ### NuGet packages
            | Package | Install |
            |---|---|
            | `tik4net` *(core + O/R mapper)* | `dotnet add package tik4net --version ${{ steps.ver.outputs.VERSION }}` |
            | `tik4net.ssh` *(satellite, opt-in)* | `dotnet add package tik4net.ssh --version ${{ steps.ver.outputs.VERSION }}` |
            | `tik4net.testing` | `dotnet add package tik4net.testing --version ${{ steps.ver.outputs.VERSION }}` |
            | `tik4net.mcp` *(dev/debug helper tool)* | `dotnet tool install -g tik4net.mcp --version ${{ steps.ver.outputs.VERSION }}` |

            ---
          files: |
            Build/*.nupkg
